# Root Hydra configuration.
#
# Composes one config group per implemented module. `corpus` selects which
# registered corpus scripts/train.py trains on (scripts/corpora_registry.py);
# it's a no-op for every other Hydra entrypoint sharing this root config
# (evaluate_*.py, prepare_*.py, inference.py, export_model.py, the API), since
# none of them reference cfg.corpus -- its default here only exists so those
# scripts don't have to pass an unused override.

defaults:
  - preprocessing: default
  # `preprocessing/augmentation.yaml`, loaded under its own `augmentation`
  # key (`@augmentation`) rather than merged into `preprocessing` -- that
  # group already holds the deterministic, inference-time pipeline (which
  # scripts.train.py's training path never runs -- see
  # IdentificationAppConfig.preprocessing's docstring); training-only
  # stochastic augmentation (scripts/_common.py:run_training) is a distinct
  # concern that happens to reuse the same YAML directory.
  - preprocessing@augmentation: augmentation
  - segmentation: default
  - datasets: default
  - feature_extraction: default
  - models: default
  - embeddings: default
  - training: default
  - evaluation: default
  - corpus: writer_id
  - _self_

project_name: writer-identification
seed: 42

checkpoint_path: null  # scripts.evaluate_writer_id / scripts.probe_corpus_separability / scripts.build_gallery: overrides the default trained checkpoint to evaluate/embed with
skip_baseline: false  # scripts.evaluate_writer_id / scripts.probe_corpus_separability: skip the untrained-DINOv2 baseline pass (it never changes run to run)
spot_check: false  # scripts.build_gallery: run the cheap few-writer correctness check instead of the full gallery build
