# Default embedding-model configuration. Keys mirror
# handwriting_engine.embeddings.config.EmbeddingConfig field-for-field; load
# via OmegaConf and validate with EmbeddingConfig.model_validate(...).

backbone:
  checkpoint: facebook/dinov2-small
  frozen: true
  # Stage 2 fine-tuning: adapts the backbone's highest-level features to
  # handwriting instead of training a head on 100% generic, frozen DINOv2
  # features (accuracy's biggest lever -- see docs/RESULTS.md). 4 of
  # dinov2-small's 12 blocks; optimizer.backbone_learning_rate (1e-5
  # default) keeps this conservative relative to the head's 1e-4.
  unfreeze_last_blocks: 4
  image_size: 224
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

head:
  output_dim: 128
  hidden_dim: null
  normalize: true
