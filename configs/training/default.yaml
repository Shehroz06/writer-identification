# Default training configuration. Keys mirror
# handwriting_engine.training.config.TrainingConfig field-for-field; load via
# OmegaConf and validate with TrainingConfig.model_validate(...).

# 30 epochs x 200 batches/epoch (6000 steps, ~6x the old 10x100 budget) --
# Stage 2 fine-tuning (embeddings/default.yaml's unfreeze_last_blocks) needs
# more steps than a head-only run to actually move the unfrozen blocks.
# Sized for a GPU run (Colab); override downward for CPU dev iteration, e.g.
# training.num_epochs=3 training.sampler.batches_per_epoch=20.
num_epochs: 30

loss:
  method: circle
  circle:
    margin: 0.25
    scale: 256.0
  triplet:
    margin: 0.3

sampler:
  num_identities_per_batch: 8
  num_samples_per_identity: 4
  batches_per_epoch: 200

optimizer:
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  backbone_learning_rate: null

scheduler:
  # Warmup + cosine decay -- standard practice once a pretrained backbone is
  # partially unfrozen (see SchedulerConfig's docstring); a true no-op when
  # unfreeze_last_blocks=0, so this is safe even if Stage 2 gets turned back
  # off later.
  enabled: true
  warmup_epochs: 2

wandb:
  mode: disabled
  project: handwriting-engine

dataloader:
  num_workers: 0
  pin_memory: false
  persistent_workers: false

device: auto
# Meaningful speedup on GPU (Colab); a documented no-op on CPU, so this
# doesn't change local CPU dev runs at all.
use_amp: true

checkpoint_dir: null
resume: true
checkpoint_every_n_epochs: 1
init_checkpoint: null
