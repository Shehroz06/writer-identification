# Default preprocessing configuration. Keys mirror
# handwriting_engine.preprocessing.config.PreprocessingConfig field-for-field;
# load via OmegaConf and validate with PreprocessingConfig.model_validate(...).

perspective:
  enabled: true
  canny_low: 50
  canny_high: 150
  approx_epsilon_ratio: 0.02
  min_area_ratio: 0.2

deskew:
  enabled: true
  angle_search_range_deg: 15.0
  coarse_step_deg: 1.0
  fine_step_deg: 0.1

denoise:
  enabled: true
  method: nlm
  nlm_h: 10.0
  nlm_template_window_size: 7
  nlm_search_window_size: 21
  bilateral_diameter: 9
  bilateral_sigma_color: 75.0
  bilateral_sigma_space: 75.0
  median_kernel_size: 3

contrast:
  enabled: true
  clip_limit: 2.0
  tile_grid_size: [8, 8]

threshold:
  method: sauvola
  sauvola_window_size: 25
  sauvola_k: 0.2
  sauvola_r: 128.0
  adaptive_block_size: 25
  adaptive_c: 10.0

morphology:
  enabled: true
  operation: close
  kernel_size: 2
  kernel_shape: rect

return_intermediates: false
