# Default feature-extraction configuration. Keys mirror
# handwriting_engine.feature_extraction.config.FeatureExtractionConfig
# field-for-field; load via OmegaConf and validate with
# FeatureExtractionConfig.model_validate(...).

slant:
  search_range_deg: 45.0
  coarse_step_deg: 2.0
  fine_step_deg: 0.5

curvature:
  neighborhood_k: 5
  min_contour_points: 15

baseline:
  max_iterations: 5
  outlier_std_threshold: 2.0

texture:
  target_size: [64, 64]
  hog_orientations: 9
  hog_pixels_per_cell: [8, 8]
  hog_cells_per_block: [2, 2]
  lbp_points: 8
  lbp_radius: 1
